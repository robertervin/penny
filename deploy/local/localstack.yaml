# Local EventBridge + SQS + S3. Workers in this cluster use
# http://localstack.penny.svc.cluster.local:4566
# The host uses http://localhost:4566 via kind extraPortMappings → NodePort 30456.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: localstack
  namespace: penny
  labels:
    app: localstack
spec:
  replicas: 1
  selector:
    matchLabels:
      app: localstack
  template:
    metadata:
      labels:
        app: localstack
    spec:
      containers:
        - name: localstack
          image: localstack/localstack:4.4.0
          ports:
            - containerPort: 4566
              name: edge
          env:
            - name: SERVICES
              value: events,sqs,s3,sts,iam,sns
            - name: DEBUG
              value: "0"
            - name: PERSISTENCE
              value: "1"
            - name: EAGER_SERVICE_LOADING
              value: "1"
          volumeMounts:
            - name: data
              mountPath: /var/lib/localstack
          readinessProbe:
            httpGet:
              path: /_localstack/health
              port: 4566
            initialDelaySeconds: 8
            periodSeconds: 5
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              memory: 2Gi
      volumes:
        - name: data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: localstack
  namespace: penny
spec:
  type: NodePort
  selector:
    app: localstack
  ports:
    - name: edge
      port: 4566
      targetPort: 4566
      nodePort: 30456
