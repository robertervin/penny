# kind cluster for Penny local Kubernetes.
# Host 4566 → NodePort 30456 so AWS CLI on the laptop can reach LocalStack.
kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: penny
nodes:
  - role: control-plane
    image: kindest/node:v1.31.4
    extraPortMappings:
      - containerPort: 30456
        hostPort: 4566
        protocol: TCP
      - containerPort: 30432
        hostPort: 5432
        protocol: TCP
