services:
  postgres:
    image: postgres:16-alpine
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: penny
      POSTGRES_PASSWORD: penny
      POSTGRES_DB: penny
    volumes:
      - penny_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U penny"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  penny_pg:
